<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepChamp Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-20">

    <main id="app-content" class="max-w-md mx-auto p-4">
        <!-- Obsah aplikace -->
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-3 text-xs font-medium text-gray-500 max-w-md mx-auto">
        <button onclick="switchTab('home')" class="flex flex-col items-center text-green-600" id="nav-home">
            <span class="text-lg">🏠</span> Home
        </button>
        <button onclick="switchTab('arena')" class="flex flex-col items-center hover:text-green-600" id="nav-arena">
            <span class="text-lg">🏆</span> Arena
        </button>
        <button onclick="switchTab('train')" class="flex flex-col items-center hover:text-green-600" id="nav-train">
            <span class="text-lg">🏋️</span> Train
        </button>
        <button onclick="switchTab('profile')" class="flex flex-col items-center hover:text-green-600" id="nav-profile">
            <span class="text-lg">👤</span> Profile
        </button>
    </nav>

    <script>
        let state = { xp: 0, level: 1, streak: 0, wins: 0 };

        function switchTab(tab) {
            document.querySelectorAll('nav button').forEach(b => b.classList.replace('text-green-600', 'text-gray-500'));
            document.getElementById('nav-' + tab).classList.replace('text-gray-500', 'text-green-600');

            const content = document.getElementById('app-content');

            if (tab === 'home') {
                content.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h1 class="text-2xl font-bold">Home</h1>
                        <div class="flex items-center text-orange-500 font-bold">🔥 ${state.streak} day streak</div>
                    </div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-4">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-bold text-lg">jkkbb24</span>
                            <span class="bg-green-100 text-green-700 text-xs px-2 py-1 rounded-full font-semibold">Level ${state.level}</span>
                        </div>
                        <div class="w-full bg-gray-200 h-3 rounded-full overflow-hidden">
                            <div class="bg-green-500 h-full" style="width: ${(state.xp % 2000) / 20}%"></div>
                        </div>
                        <p class="text-xs text-gray-400 mt-1">${state.xp} / 2000 XP do dalšího levelu</p>
                    </div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-4">
                        <h3 class="font-bold text-gray-700 mb-1">Today's Challenge</h3>
                        <p class="text-sm text-gray-500 mb-3">Do 3 sets of 15 push-ups (Earn 200 XP)</p>
                        <button onclick="completeWorkout()" class="w-full bg-green-500 text-white py-3 rounded-xl font-bold shadow-md">Start Workout</button>
                    </div>
                `;
            } else if (tab === 'train') {
                content.innerHTML = `
                    <h1 class="text-2xl font-bold mb-4">Push & Squat Roadmap</h1>
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-center py-10">
                        <p class="text-gray-500 mb-4">Tréninková cesta a odemykání úrovní.</p>
                        <button onclick="completeWorkout()" class="bg-green-500 text-white px-6 py-2 rounded-xl font-bold">Splnit 10 kliků</button>
                    </div>
                `;
            } else if (tab === 'arena') {
                content.innerHTML = `
                    <h1 class="text-2xl font-bold mb-4">Arena</h1>
                    <div class="bg-green-500 text-white p-5 rounded-2xl mb-4 shadow-sm">
                        <h2 class="text-xl font-bold">1 vs 1 Duel</h2>
                        <p class="text-sm opacity-90
